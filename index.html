<!DOCTYPE html>
<html>
    <head>
        <title>Mortage Repayment Calculator</title>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <style>
            body{
                background-color: hsl(202, 86%, 94%);
                font-family: 'plus jakarta sans',sans-serif;
            }
            .mortage{
                margin: 100px;
                margin-left: 400px;
            }
            .calculator{
                background-color: hsl(0, 0%, 100%);
                
                
                position: absolute;
                width: 600px;
                border-radius: 10px;
                gap: 0;
                padding: 13px;
                min-height: 200px;
                margin-left: 0px;
            }
            .calculator h4,
            .calculator p{
                margin-bottom: 10px;
            }
            .result{
                background-color: hsl(202, 55%, 16%);
                
                position: absolute;
                width: 325px;
                border-radius: 20px;
                gap: 0;
                margin-left: 350px;
                padding: 15px;
                min-height: 400px;
                border-bottom-left-radius: 60px;
            }
            .mortage{
                display:flex;
                justify-content:center;
                align-items:flex-start;
            }
            .mrepay{
                background-color: hsl(200, 100%, 12%) ;
                border-top: 5px solid hsl(61,70%,52%);
                width: 275px;
                min-height: 100px;
                padding: 5px;
                border-radius: 30px;
                align-items: center;
            }
            .calrep{
                background: hsl(61,70%,52%);
                border-radius: 30px;
                width: 200px;
                height: 50px;
                font-size: 13px;
                font-weight: 500;
                transition: 0.2s;
            }
            .calrep:hover{
                opacity: 0.85;
            }
            .row{
                display: flex;
                gap: 40px;
                padding: 10px;
                margin-bottom: 25px;
            }
            .mterm{
                width: 180px;
                border-radius: 4px;
                border: 1px solid hsl(203,41%,72%);
                height: 30px;
            }
            .irate{
                width: 180px;
                border-radius: 4px;
                border: 1px solid hsl(203,41%,72%);
                height: 30px;
            }
            .amount{
                width: 100%;
                height:40px;
            }
            .option{
                border:1px solid hsl(203, 41%, 72%);
                padding:5px;
                border-radius:10px;
                margin-bottom:10px;
                width: 250px;
                cursor: pointer;
                transition: 0.2s;
            }
            .option:hover{
                border-color: hsl(61,70%,52%);
                background: hsl(61,70%,95%);
            }
            button{
                background:hsl(61, 70%, 52%);
                border:none;
                padding:15px 25px;
                border-radius:30px;
                font-weight:bold;
                cursor:pointer;
            }
            .result-box{
                background: #022b3a;
                color: hsl(61, 70%, 52%);
                padding: 10px;
                border-radius: 20px;
                align-items: center;
            }
            .option input:checked{
                accent-color: hsl(61,70%,52%);
            }
            h3{
                font-size: 16px;
                font-weight: 400px;
            }
           .header{
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-right: 320px;
            }
            #clearAll{
                color:hsl(200, 24%, 40%);
                text-decoration:underline;
                cursor:pointer;
                font-size:14px;
            }
        </style>
    </head>
    <body>
        <section class="mortage">
            <div class="calculator">
                <div class="header">
                <h3 style="color: hsl(202, 55%, 16%);">Mortage Calculator</h3>
                <a href="#" id="clearall" onclick="clearAll()">clearall</a>
                </div>
                <div class="input-group">
                    <h4 style="color: darkgray; font-weight: bold;">Mortage Amount</h4>
                    <span style="background: lightblue; padding: 7px;">£</span>
                    <input type="text" id="amount" name="amount" class="amount" style="width: 200px;">
                </div>
                <div class="row">
                    <div>
                        <label>Mortage Term</label><br>
                        <input style="width: 100px;background: lightblue; padding: 1px;" class="mterm" id="term" placeholder="years">
                    </div>
                    <div>
                        <label>Interest Rate</label><br>
                        <input style="width: 100px;background: lightblue;padding: 1px;" class="irate" id="rate" placeholder="%">
                    </div>
                </div>
                <p style="color: darkgray; font-weight: bold;">Mortage type</p>
                <div class="option">
                    <input type="radio" id="repayment" name="mortgage-type">
                    <label for="repayment">Repayment</label>
                </div>
                <div class="option">
                    <input type="radio" id="interest" name="mortgage-type">
                    <label for="interest">Interest Only</label>
                </div>
                <br>
                <button class="calrep" onclick="calculateMortage()">
                    <i class="fa-solid fa-calculator"></i>
                    Calculate Repayments
                </button>
            </div>
            <div class="result">
                <h3 style="color: hsl(61, 70%, 52%);">Your results</h3>
                <p style="color: white;">Your results are shown below based on the information you provided. To adjust the results ,edit the form and click "calculate repayments again"</p>
                <div class="mrepay">
                    <P style="color: aliceblue;">your monthly repayments</P>
                    <div class="result-box">
                        <h1 id="monthly">£0.00</h1>
                        <hr>
                        <p>Total you'll repay over the term</p>
                        <h2 id="total">£0.00</h2>
                    </div>
                </div>
            </div>
        </section>
    <script>
        function calculateMortage(){
            const p = Number(document.getElementById("amount").value);
            const annualRate = Number(document.getElementById("rate").value);
            const years = Number(document.getElementById("term").value);

            const r= annualRate/100/12;
            const n= years*12;

            const monthlyPayment = p *(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
            //M=P r(1+r)^n/r(1+r)n​-1

            const totalRepayment = monthlyPayment * n;

            document.getElementById("monthly").textContent = 
            '£' + monthlyPayment.toFixed(2);

            document.getElementById("total").textContent = 
            '£' + totalRepayment.toFixed(2);
        }
        function clearAll() {
            document.getElementById("amount").value = "";
            document.getElementById("term").value = "";
            document.getElementById("rate").value = "";

            document.getElementById("repayment").checked = false;
            document.getElementById("interest").checked = false;

            document.getElementById("monthly").textContent = "£0.00";
            document.getElementById("total").textContent = "£0.00";
        }
    </script>
    </body>
</html>
